server:
  port: 8080
  servlet:
    session:
      cookie:
        secure: ${SESION_COOKIE_SEGURA:false}
app:
  sesion-prueba:
    habilitada: ${SESION_PRUEBA_HABILITADA:false}
    usuario: ${SESION_PRUEBA_USUARIO:operacion_local}
spring:
  config:
    import: optional:file:.local/application-local-private.properties
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/orcl}
    username: ${DB_USERNAME:hotelRB}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # Validar el DDL existente sin modificar las tablas.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
    version: OPENAPI_3_0

logging:
  level:
    root: INFO
    pe.com.rebolsysBackend: DEBUG
