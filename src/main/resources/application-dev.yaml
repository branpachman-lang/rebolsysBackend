server:
  port: 8080
spring:
  config:
    import: optional:file:.local/application-local-private.properties
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      # Validar el DDL existente sin modificar las tablas.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    pe.com.rebolsysBackend: DEBUG
