spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  application:
    name: rebolsysBackend
  profiles:
    active: dev
  flyway:
    # El DDL ya fue ejecutado manualmente.
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

apis-peru:
  url: ${APISPERU_BASE_URL:https://dniruc.apisperu.com/api/v1}
  token: ${APISPERU_TOKEN:}
  timeout-millis: ${APISPERU_TIMEOUT_MILLIS:8000}
